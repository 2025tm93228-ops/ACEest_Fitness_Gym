name: ACEest CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: aceest-fitness

jobs:
  # ---------- Stage 1: Build & Lint ----------
  build-and-lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile all sources (syntax check)
        run: python -m compileall -q app.py db.py models.py tests

      - name: Lint with flake8 (fail on real errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --statistics

      - name: Run Pytest on the runner
        run: pytest -v --cov=. --cov-report=term-missing

  # ---------- Stage 2: Docker assembly + tests inside the container ----------
  docker-build-and-test:
    name: Docker Image Assembly & Containerised Tests
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: ${{ env.IMAGE_NAME }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Execute Pytest suite inside the container
        run: docker run --rm ${{ env.IMAGE_NAME }}:test pytest -v

      - name: Build production runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha

      - name: Smoke-test the running container
        run: |
          docker run -d --name aceest -p 5000:5000 ${{ env.IMAGE_NAME }}:latest
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then echo " -> healthy"; break; fi
            echo "waiting for app... ($i)"; sleep 2
          done
          curl -fsS http://localhost:5000/health | grep -q healthy
          curl -fsS http://localhost:5000/api/programs | grep -q "Muscle Gain"
          docker logs aceest
          docker rm -f aceest

      - name: Report image size
        run: docker images ${{ env.IMAGE_NAME }}
