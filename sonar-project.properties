# ---------------------------------------------------------------------------
# SonarQube configuration for the ACEest Fitness & Gym application.
# Run locally with:  sonar-scanner -Dsonar.host.url=http://localhost:9000 -Dsonar.login=<token>
# ---------------------------------------------------------------------------
sonar.projectKey=aceest-fitness
sonar.projectName=ACEest Fitness and Gym
sonar.projectVersion=1.0.0

# Analyse the application source only; tests are declared separately so that
# test code is not counted against the production quality gate.
sonar.sources=app.py,db.py,models.py
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# Coverage produced by pytest-cov in the Jenkins "Unit Tests" stage.
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.junit.reportPaths=reports/junit.xml

# Keep generated and vendored content out of the analysis.
sonar.exclusions=**/.venv/**,**/__pycache__/**,**/htmlcov/**,**/*.db,k8s/**,docs/**
